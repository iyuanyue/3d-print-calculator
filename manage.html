<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>预设管理 · 3D打印计算器</title>
    <meta name="description" content="管理3D打印计算器的打印机与耗材预设：修改参数、新增自定义机型与耗材，改动即时保存并用于首页快速填充。">
    <link rel="canonical" href="https://3d.iyuanyue.com/manage.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="3D打印计算器">
    <meta property="og:title" content="预设管理 · 3D打印计算器">
    <meta property="og:description" content="管理打印机与耗材预设，新增自定义机型/耗材，改动即时保存。">
    <meta property="og:url" content="https://3d.iyuanyue.com/manage.html">
    <meta name="theme-color" content="#eef1f6">
    <script>
        /* 主题初始化：在样式表加载前决定深浅色，避免闪烁 */
        (function () {
            try {
                var KEY = '3dpc-theme';
                var q = new URLSearchParams(location.search).get('theme');
                var m = (q === 'light' || q === 'dark') ? q : (localStorage.getItem(KEY) || 'auto');
                var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = m === 'dark' || (m === 'auto' && sysDark);
                var el = document.documentElement;
                el.setAttribute('data-theme-mode', m);
                el.setAttribute('data-theme', dark ? 'dark' : 'light');
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', dark ? '#070b10' : '#eef1f6');
            } catch (e) { }
        })();
    </script>
    <style>html{background:#eef1f6}html[data-theme="dark"]{background:#070b10}</style>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/manage.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <script async src="https://019aabda-1de0-7eae-9460-7fbf4c8caa7a.spst2.com/ustat.js"></script>
</head>
<body>
    <div class="container">
        <div class="manage-shell">
            <header class="app-header">
                <a class="brand" href="index.html">
                    <span class="brand-mark" aria-hidden="true">3D</span>
                    <div class="brand-text">
                        <h1 class="brand-title">预设管理</h1>
                        <p class="brand-sub">打印机与耗材 · 改动即时保存</p>
                    </div>
                </a>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题">
                        <span class="theme-icon icon-auto" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.2" /><path d="M12 3.8a8.2 8.2 0 0 1 0 16.4z" fill="currentColor" stroke="none" /></svg></span>
                        <span class="theme-icon icon-light" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6" /></svg></span>
                        <span class="theme-icon icon-dark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.2A8.6 8.6 0 1 1 10.8 3.5a6.7 6.7 0 0 0 9.7 9.7z" /></svg></span>
                    </button>
                </div>
            </header>

            <div class="manage-body">
                <section class="panel" id="printerPanel">
                    <div class="panel-head">
                        <h2 class="panel-title">打印机</h2>
                        <span class="panel-sub" id="printerCount">—</span>
                    </div>
                    <p class="manage-hint">功率 / 价格 / 寿命会参与折旧成本计算；选「其他」录入的机型可存为预设。</p>
                    <div class="manage-list" id="printerList"></div>
                    <button class="add-row" id="addPrinterBtn" type="button">＋ 新增机型</button>
                </section>

                <section class="panel" id="filamentPanel">
                    <div class="panel-head">
                        <h2 class="panel-title">耗材</h2>
                        <span class="panel-sub" id="filamentCount">—</span>
                    </div>
                    <p class="manage-hint">单价用于材料成本；自定义耗材会出现在首页的「耗材类型」下拉里。</p>
                    <div class="manage-list" id="filamentList"></div>
                    <button class="add-row" id="addFilamentBtn" type="button">＋ 新增耗材</button>
                </section>

                <div class="manage-footer">
                    <button class="btn clear" id="resetAllBtn" type="button">恢复全部默认</button>
                    <p class="manage-note">只清除本地的自定义与改动，不影响历史记录。</p>
                </div>
            </div>
        </div>

        <nav class="tab-bar">
            <a href="index.html" class="tab-item">
                <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.2" y="2.6" width="15.6" height="18.8" rx="3.4" /><path d="M8 7.6h8" /><path d="M8.4 12.2h.01M12 12.2h.01M15.6 12.2h.01M8.4 16.4h.01M12 16.4h.01M15.6 16.4h.01" /></svg></span>
                <span class="tab-text">计算器</span>
            </a>
            <a href="history.html" class="tab-item">
                <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6" /><path d="M12 7.4V12l3.1 2" /></svg></span>
                <span class="tab-text">历史记录</span>
            </a>
            <a href="manage.html" class="tab-item active">
                <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2.2" /><circle cx="8" cy="17" r="2.2" /></svg></span>
                <span class="tab-text">管理</span>
            </a>
        </nav>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/config.js"></script>
    <script src="js/filament-catalog.js"></script>
    <script src="js/printer-catalog.js"></script>
    <script src="js/manage.js"></script>
</body>

</html>
